<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Battle Arena — Battlegrounds Fighter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07060f;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--red:#ff4d5e;--blue:#4cc9ff}
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;min-height:100%;overscroll-behavior:none;color:#eaf0ff;font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
    background:radial-gradient(1100px 560px at 50% -10%,#3a1650 0,transparent 60%),
               radial-gradient(900px 500px at 100% 100%,#0e2a4f 0,transparent 55%),var(--bg);background-attachment:fixed;
    user-select: none; -webkit-user-select: none;}
  .app{max-width:1100px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:'Bebas Neue',Impact,sans-serif;font-size:38px;letter-spacing:3px;line-height:1;
    background:linear-gradient(90deg,#fff,#ff9a6b 55%,#ff4d5e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{display:block;font:600 12px 'Rajdhani',sans-serif;letter-spacing:4px;color:#9aa6d0;-webkit-text-fill-color:#9aa6d0}
  .tools{display:flex;gap:8px}
  .tools button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(10px);transition:.15s}
  .tools button:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
  .stage{border-radius:20px;padding:5px;background:linear-gradient(135deg,rgba(255,77,94,.85),rgba(76,201,255,.85));
    box-shadow:0 24px 90px rgba(255,77,94,.25),0 0 0 1px rgba(255,255,255,.1); position: relative; flex: 1; display: flex;}
  canvas{display:block;width:100%;height:100%;object-fit:contain;border-radius:16px;background:#000}
  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px 18px 10px;backdrop-filter:blur(14px)}
  .card h3{margin:0 0 8px;font:700 15px 'Rajdhani',sans-serif;letter-spacing:3px;text-transform:uppercase;color:var(--blue)}
  .card.p2 h3{color:var(--red)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0;font-weight:600;font-size:15px;color:#c9d3f0}
  .keys{display:flex;gap:4px}
  kbd{min-width:32px;height:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;
    background:linear-gradient(#2d3250,#1a1d2e);border:1px solid #3b4160;border-bottom-width:3px;font:700 14px 'Rajdhani',sans-serif;color:#fff;transition:.06s}
  kbd.on{transform:translateY(2px);border-bottom-width:1px;background:linear-gradient(#4cc9ff,#2a7fd0);border-color:#9be3ff;box-shadow:0 0 16px rgba(76,201,255,.8)}
  .card.p2 kbd.on{background:linear-gradient(#ff7a8a,#ff4d5e);border-color:#ffb0b9;box-shadow:0 0 16px rgba(255,77,94,.8)}
  .tip{margin:8px 0 2px;font-size:13px;color:#8e9ac4;font-weight:500}
  
  /* === MOBILE CONTROLS (MANTIS PRO STYLE) === */
  .mobile-only{display:none}
  .mobile-ui{position:absolute; top:0; left:0; right:0; bottom:0; pointer-events:none; z-index:100; overflow:hidden;}
  
  .dpad { position: absolute; bottom: 20px; left: 20px; width: 160px; height: 160px; pointer-events: auto; }
  .dpad-btn { position: absolute; background: rgba(20, 25, 40, 0.7); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 14px; width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.6); font-size: 20px; backdrop-filter: blur(4px); transition: 0.1s; touch-action: none; }
  .dpad-btn:active, .dpad-btn.active { background: rgba(76, 201, 255, 0.6); border-color: #4cc9ff; color: #fff; box-shadow: 0 0 15px #4cc9ff; transform: scale(0.95); }
  .dpad-up { top: 0; left: 53px; }
  .dpad-down { bottom: 0; left: 53px; }
  .dpad-left { top: 53px; left: 0; }
  .dpad-right { top: 53px; right: 0; }
  
  .action-btns { position: absolute; bottom: 20px; right: 20px; width: 160px; height: 160px; pointer-events: auto; }
  .action-btn { position: absolute; background: rgba(20, 25, 40, 0.7); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: rgba(255, 255, 255, 0.6); backdrop-filter: blur(4px); transition: 0.1s; touch-action: none; }
  .action-btn:active, .action-btn.active { background: rgba(255, 77, 94, 0.7); border-color: #ff4d5e; color: #fff; box-shadow: 0 0 15px #ff4d5e; transform: scale(0.92); }
  
  .btn-y { top: 0; right: 50px; }
  .btn-x { top: 50px; right: 0; }
  .btn-b { top: 50px; right: 100px; }
  .btn-a { top: 100px; right: 50px; background: rgba(76, 201, 255, 0.3); border-color: rgba(76, 201, 255, 0.6); }

  .mobile-menu,.mobile-select{display:none;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); z-index:200; width:100%;}
  .mobile-menu button,.mobile-select button{border:1px solid var(--blue);border-radius:12px;background:#14223d;color:#fff;padding:12px 24px;font:700 17px 'Rajdhani',sans-serif; pointer-events:auto; cursor:pointer;}
  .mobile-select button{padding:12px 15px;}

  @media(max-width:900px), (pointer:coarse){
    .app{padding:8px 8px calc(12px + env(safe-area-inset-bottom));gap:9px; height:100vh;}
    .logo{font-size:25px;letter-spacing:2px}.logo small{font-size:10px}
    .tools button{width:42px;height:42px}
    .stage{padding:3px;border-radius:13px}
    canvas{aspect-ratio:auto;border-radius:10px;touch-action:none; width:100%; height:100%;}
    .controls{display:none}
    .mobile-only{display:block}
    .mobile-ui.active {display:block;}
  }
  @media(max-width:900px) and (orientation:landscape){
    .app{max-width:none;padding:4px 8px;gap:4px}
    header{display:none;} /* Esconde o header no landscape para dar espaço */
    .stage{flex:1;min-height:0}
    canvas{height:100%;width:100%;object-fit:contain}
  }
  :fullscreen .app{width:100vw;height:100dvh;max-width:none;margin:0;padding:0;gap:0}
  :fullscreen header{display:none;}
  :fullscreen .stage{flex:1;min-height:0; border-radius:0; padding:0;}
  :fullscreen canvas{border-radius:0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">BATTLE ARENA<small>ULTRA EDITION</small></div>
    <div class="tools"><button id="btnMute" title="Som (P)">🔊</button><button id="btnFs" title="Tela cheia">⛶</button></div>
  </header>
  
  <div class="stage" id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    
    <!-- Mobile UI (Overlay) -->
    <div class="mobile-ui mobile-only" id="mobileUI">
      <!-- Menu Inicial -->
      <div class="mobile-menu" id="mobileMenu">
        <button id="mobileStart">⚔️ JOGAR CONTRA CPU</button>
      </div>
      
      <!-- Seleção de Personagem -->
      <div class="mobile-select" id="mobileSelect">
        <button id="mobilePrev" aria-label="Anterior">◀</button>
        <button id="mobileConfirm">CONFIRMAR</button>
        <button id="mobileNext" aria-label="Próximo">▶</button>
      </div>

      <!-- Controles In-Game (D-Pad + Action) -->
      <div id="touchControls" style="display:none; width:100%; height:100%;">
        <div class="dpad">
          <div class="dpad-btn dpad-up" data-key="KeyW">▲</div>
          <div class="dpad-btn dpad-left" data-key="KeyA">◀</div>
          <div class="dpad-btn dpad-right" data-key="KeyD">▶</div>
          <div class="dpad-btn dpad-down" data-key="KeyS">▼</div>
        </div>
        <div class="action-btns">
          <div class="action-btn btn-y" data-key="KeyQ">Soco</div>
          <div class="action-btn btn-x" data-key="KeyE">Chute</div>
          <div class="action-btn btn-b" data-key="KeyF">🛡</div>
          <div class="action-btn btn-a" data-key="Digit1">✦</div>
        </div>
      </div>
    </div>
  </div>
  
  <section class="controls">
    <div class="card p1"><h3>Jogador 1</h3><div class="grid">
      <div class="row">Frente / Trás<span class="keys"><kbd data-k="KeyA">A</kbd><kbd data-k="KeyD">D</kbd></span></div>
      <div class="row">Pular<span class="keys"><kbd data-k="KeyW">W</kbd></span></div>
      <div class="row">Agachar<span class="keys"><kbd data-k="KeyS">S</kbd></span></div>
      <div class="row">Defender<span class="keys"><kbd data-k="KeyF">F</kbd></span></div>
      <div class="row">Soco<span class="keys"><kbd data-k="KeyQ">Q</kbd></span></div>
      <div class="row">Chute<span class="keys"><kbd data-k="KeyE">E</kbd></span></div>
      <div class="row">Especial<span class="keys"><kbd data-k="Digit1">1</kbd></span></div>
    </div><p class="tip">Agachado, socos altos passam por cima de você.</p></div>
    <div class="card p2"><h3>Jogador 2</h3><div class="grid">
      <div class="row">Frente / Trás<span class="keys"><kbd data-k="ArrowLeft">←</kbd><kbd data-k="ArrowRight">→</kbd></span></div>
      <div class="row">Pular<span class="keys"><kbd data-k="ArrowUp">↑</kbd></span></div>
      <div class="row">Agachar<span class="keys"><kbd data-k="ArrowDown">↓</kbd></span></div>
      <div class="row">Defender<span class="keys"><kbd data-k="KeyB">B</kbd></span></div>
      <div class="row">Soco<span class="keys"><kbd data-k="KeyN">N</kbd></span></div>
      <div class="row">Chute<span class="keys"><kbd data-k="KeyM">M</kbd></span></div>
      <div class="row">Especial<span class="keys"><kbd data-k="Digit2">2</kbd></span></div>
    </div><p class="tip">P = silenciar som · Esc = menu</p></div>
  </section>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const GROUND_Y = 460;
const ARENA_LEFT = 30, ARENA_RIGHT = W - 30;
const GRAVITY = 0.95;
const ROUND_TIME = 60 * 60;

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rnd = (a,b) => a + Math.random() * (b - a);
const aabb = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

/* ============================================================
   AUDIO
============================================================ */
let audioCtx = null, muted = false;
function beep(freq, dur, type = 'square', vol = 0.05){
  if (muted) return;
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq*0.6), audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}

/* ============================================================
   GOLPES & CONSTANTES
============================================================ */
const ATTACKS = {
  punch: { duration:16, start:5,  end:9,  damage:3,  reach:66, top:44, bottom:84,
           knockback:3.5, launch:1.5, hitstun:11, cooldown:5,  sound:520 },
  kick:  { duration:30, start:12, end:18, damage:6,  reach:90, top:16, bottom:70,
           knockback:7.5, launch:5,   hitstun:22, cooldown:10, sound:300 }
};

const SPECIAL = {
  chargeTime: 50, windup: 9, recover: 26, flySpeed: 15, flyUp: -13, damage: 12, hitsRequired: 10
};

const CHARS = [
  { name:'RYO', accent:'#ff4d4d', skin:'#e8b088', hair:'#17110f', style:'spiky', top:'#f3f4f8', pants:'#e9eaf0', pantsD:'#c3c6d4', belt:'#16161e', boots:'#e8b088', band:'#e02c2c', glove:'#e02c2c', fist:'#e02c2c' },
  { name:'KAI', accent:'#ffd24d', skin:'#f0be90', hair:'#f4c63c', style:'long', top:'#d92a22', pants:'#d92a22', pantsD:'#a51d18', belt:'#16161e', boots:'#f0be90', glove:'#d92a22', fist:'#d92a22' },
  { name:'LIN', accent:'#4aa3ff', skin:'#f3d0a8', hair:'#2b1b15', style:'buns', top:'#2e63d8', sleeve:'#2e63d8', pants:'#a8323f', pantsD:'#7d2230', belt:'#e8c04a', boots:'#f4f4f8', glove:'#34343f' },
  { name:'LEI', accent:'#c58bff', skin:'#dca06c', hair:'#0f0b0c', style:'tail', shirtless:true, pants:'#25252e', pantsD:'#15151b', belt:'#25252e', boots:'#e9dcb8' }
];

const keys = {}, justPressed = {};
const isMobile = () => window.matchMedia('(max-width: 900px), (pointer:coarse)').matches;
const BLOCK_DEFAULT = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];

function lit(c, on){ const k = document.querySelector('[data-k="' + c + '"]'); if (k) k.classList.toggle('on', on); }

addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true; lit(e.code, true);
  if (BLOCK_DEFAULT.includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; lit(e.code, false); });
addEventListener('blur', () => { for (const k in keys){ keys[k] = false; lit(k, false); } });

const P1_KEYS = { left:'KeyA', right:'KeyD', jump:'KeyW', crouch:'KeyS', block:'KeyF', punch:'KeyQ', kick:'KeyE', special:'Digit1' };
const P2_KEYS = { left:'ArrowLeft', right:'ArrowRight', jump:'ArrowUp', crouch:'ArrowDown', block:'KeyB', punch:'KeyN', kick:'KeyM', special:'Digit2' };

function readInput(km){
  return {
    left: !!keys[km.left], right: !!keys[km.right], block: !!keys[km.block], crouch: !!keys[km.crouch],
    jump: !!justPressed[km.jump], punch: !!justPressed[km.punch], kick: !!justPressed[km.kick], special: !!keys[km.special]
  };
}

/* ============================================================
   FIGHTER
============================================================ */
class Fighter {
  constructor(cfg){
    this.name = cfg.name;
    this.ch = cfg.ch;
    this.isAI = cfg.isAI;
    this.w = 54; this.h = 96;
    this.speed = 4.6; this.jumpPower = -16.5;
    this.maxHp = 100; this.roundsWon = 0;
    this.reset(cfg.x, cfg.facing);
  }

  reset(x, facing){
    this.x = x; this.y = GROUND_Y;
    this.vx = 0; this.vy = 0;
    this.facing = facing;
    this.hp = this.maxHp; this.dispHp = this.maxHp;
    this.onGround = true;
    this.blocking = false; this.crouching = false;
    this.attack = null; this.attackCooldown = 0;
    this.hitstun = 0; this.blockstun = false; // CORREÇÃO: blockstun adicionado
    this.flash = 0; this.ko = false; this.walkPhase = 0;
    this._foeWasAttacking = false; this._shouldBlock = false; this._chargingSpecial = false;
    this.specialCharge = 1; this.hitCounter = 0;
    this.charging = false; this.chargeTime = 0;
    this.special = null; this.specialRecover = 0;
  }

  get hurtBox(){
    const h = this.crouching ? this.h * 0.45 : this.h;
    return { x: this.x - this.w/2, y: this.y - h, w: this.w, h };
  }

  getAttackBox(){
    if (this.special && this.special.phase === 'fly' && !this.special.hasHit){
      const reach = 78;
      const x = this.facing === 1 ? this.x + 6 : this.x - 6 - reach;
      return { x, y: this.y - 84, w: reach, h: 84 };
    }
    const a = this.attack;
    if (!a) return null;
    const d = a.def;
    if (a.frame < d.start || a.frame > d.end) return null;
    const x = this.facing === 1 ? this.x + this.w/2 - 8 : this.x - this.w/2 + 8 - d.reach;
    return { x, y: this.y - d.bottom, w: d.reach, h: d.bottom - d.top };
  }

  startAttack(type){
    if (this.attack || this.special || this.hitstun > 0 || this.blocking || this.attackCooldown > 0 || this.ko) return;
    this.attack = { type, def: ATTACKS[type], frame: 0, hasHit: false };
    this.attackCooldown = ATTACKS[type].duration + ATTACKS[type].cooldown;
    beep(ATTACKS[type].sound * 1.6, 0.05, 'square', 0.025);
  }

  fireSpecial(foe){
    this.charging = false; this.chargeTime = 0; this.specialCharge = 0; this.hitCounter = 0;
    this.attack = null; this.attackCooldown = 0; this.blocking = false;
    this.facing = foe.x >= this.x ? 1 : -1;
    this.vx = 0; this.vy = 0;
    this.special = { phase:'windup', timer: SPECIAL.windup, hasHit:false };
    spawnParticles(this.x, this.y - 40, '#7de3ff', 16, 1.1);
    beep(320, 0.18, 'sawtooth', 0.055);
  }

  registerHit(){
    if (this.specialCharge >= 1) return;
    this.hitCounter++;
    if (this.hitCounter >= SPECIAL.hitsRequired){
      this.hitCounter = 0; this.specialCharge = 1;
      spawnParticles(this.x, this.y - 62, '#7de3ff', 22, 1.3);
      beep(1200, 0.10, 'sine', 0.05); beep(1600, 0.10, 'sine', 0.04);
    }
  }

  stepSpecial(dt, foe){
    const s = this.special;
    if (!s) return;
    s.timer -= dt;
    if (s.phase === 'windup'){
      this.vx = 0;
      if (s.timer <= 0){
        s.phase = 'fly';
        const dir = foe.x >= this.x ? 1 : -1;
        this.facing = dir; this.vx = dir * SPECIAL.flySpeed; this.vy = SPECIAL.flyUp; this.onGround = false;
        spawnParticles(this.x, this.y, '#7de3ff', 20, 1.4); beep(240, 0.22, 'sawtooth', 0.06);
      }
    } else if (s.phase === 'fly'){
      if (!s.hasHit){
        const dir = foe.x >= this.x ? 1 : -1;
        this.vx += dir * 0.30 * dt;
        this.vx = clamp(this.vx, -SPECIAL.flySpeed * 1.25, SPECIAL.flySpeed * 1.25);
        if (Math.random() < 0.5 * dt) spawnParticles(this.x - this.facing*22, this.y - 42, '#7de3ff', 1, 0.6);
      }
    } else if (s.phase === 'recover'){
      if (s.timer <= 0){ this.special = null; this.specialRecover = 10; }
    }
  }

  update(dt, foe){
    if (this.attackCooldown > 0) this.attackCooldown -= dt;
    if (this.flash > 0) this.flash -= dt;
    if (this.hitstun > 0) this.hitstun -= dt;
    if (this.blockstun && this.hitstun <= 0) this.blockstun = false; // CORREÇÃO
    if (this.specialRecover > 0) this.specialRecover -= dt;

    if (this.special) this.stepSpecial(dt, foe);
    else if (this.attack){
      this.attack.frame += dt;
      if (this.attack.frame >= this.attack.def.duration) this.attack = null;
    }

    if (!this.charging && this.chargeTime > 0) this.chargeTime = Math.max(0, this.chargeTime - 1.6 * dt);

    this.vy += GRAVITY * dt;
    this.y += this.vy * dt;
    if (this.y >= GROUND_Y){ this.y = GROUND_Y; this.vy = 0; this.onGround = true; }
    else this.onGround = false;

    this.x += this.vx * dt;
    this.vx *= Math.pow(this.onGround ? 0.80 : 0.975, dt);

    if (this.x < ARENA_LEFT + this.w/2)  { this.x = ARENA_LEFT + this.w/2;  this.vx *= -0.3; }
    if (this.x > ARENA_RIGHT - this.w/2) { this.x = ARENA_RIGHT - this.w/2; this.vx *= -0.3; }

    if (this.special && this.special.phase === 'fly' && this.onGround){
      this.special.phase = 'recover'; this.special.timer = SPECIAL.recover; this.vx = 0;
      shake = Math.max(shake, 6); spawnParticles(this.x, this.y, '#9fd0ff', 14, 1.1); beep(120, 0.14, 'square', 0.04);
    }

    // CORREÇÃO: Garante que ele vira para o oponente durante o blockstun também
    if (!this.attack && !this.special && (this.hitstun <= 0 || this.blocking))
      this.facing = foe.x >= this.x ? 1 : -1;

    if (Math.abs(this.vx) > 0.6 && this.onGround) this.walkPhase += dt * 0.28;
    else this.walkPhase *= Math.pow(0.9, dt);

    this.dispHp += (this.hp - this.dispHp) * Math.min(1, 0.10 * dt);
  }
}

/* ============================================================
   ESTADO GLOBAL & PARTÍCULAS
============================================================ */
const player1 = new Fighter({ name:'P1', x:260, facing:1, ch:CHARS[0] });
const player2 = new Fighter({ name:'CPU', x:700, facing:-1, ch:CHARS[1], isAI:true });
let sel = { step:0, p1:0, p2:1 };
let phase = 'menu', phaseTimer = 0, roundNum = 1, roundFrames = 0, twoPlayer = false, hitstop = 0, shake = 0;
let storm = { left: ARENA_LEFT, right: ARENA_RIGHT, active: false };
let particles = [], damageNumbers = [], announcement = { text:'', sub:'', timer:0 };

function spawnParticles(x, y, color, count, power){
  for (let i = 0; i < count; i++){
    const a = Math.random() * Math.PI * 2, s = rnd(1.5, 5.5) * power;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.2, life: rnd(14, 30), maxLife: 30, color, size: rnd(2, 5.5) });
  }
}
function spawnDamageNumber(x, y, value, color, big){
  damageNumbers.push({ x, y, vy: -1.6, life: 46, maxLife: 46, text: String(value), color, big: !!big });
}
function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.28 * dt; p.vx *= Math.pow(0.96, dt); p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = damageNumbers.length - 1; i >= 0; i--){
    const d = damageNumbers[i]; d.y += d.vy * dt; d.vy *= Math.pow(0.94, dt); d.life -= dt;
    if (d.life <= 0) damageNumbers.splice(i, 1);
  }
}

/* ============================================================
   COMBATE (CORREÇÕES DE DEFESA APLICADAS AQUI)
============================================================ */
function applyInput(f, inp, dt, foe){
  if (f.ko) return;

  if (f.special){
    f.charging = false; f.blocking = false; f.crouching = false; return;
  }

  const busy = !!f.attack;
  const guard = !busy && !f.charging && !!inp.block && f.onGround;

  // Durante hitstun/blockstun: mantém a defesa se for blockstun e o jogador estiver segurando
  if (f.hitstun > 0){
    f.charging = false;
    f.crouching = false;
    f.blocking = !busy && !!inp.block && f.onGround && f.blockstun;
    return;
  }

  f.blocking = guard;
  f.crouching = f.onGround && !f.charging && !!inp.crouch;

  const canCharge = f.specialCharge > 0 && !busy && !f.blocking && !f.crouching && f.onGround && f.specialRecover <= 0;

  if (inp.special && canCharge){
    f.charging = true; f.vx = 0; f.chargeTime += dt;
    if (Math.random() < 0.35 * dt) spawnParticles(f.x + rnd(-24,24), f.y - rnd(10,80), '#7de3ff', 1, 0.7);
    if (f.chargeTime >= SPECIAL.chargeTime){ f.fireSpecial(foe); return; }
  } else {
    f.charging = false;
  }

  if (!busy && !f.blocking && !f.charging && !f.crouching){
    if (inp.left && !inp.right) f.vx = -f.speed;
    else if (inp.right && !inp.left) f.vx = f.speed;
    if (inp.jump && f.onGround){ f.vy = f.jumpPower; f.onGround = false; beep(430, 0.09, 'sine', 0.035); }
  }

  if (!f.charging){
    if (inp.punch) f.startAttack('punch');
    if (inp.kick)  f.startAttack('kick');
  }
}

function resolveHits(a, b){
  const box = a.getAttackBox();
  if (!box || b.ko) return;

  let isSpecial = false, def = null;
  if (a.special && a.special.phase === 'fly'){
    if (a.special.hasHit) return;
    isSpecial = true;
    def = { damage: SPECIAL.damage, knockback: 11, launch: -9, hitstun: 34 };
  } else if (a.attack){
    if (a.attack.hasHit) return;
    def = a.attack.def;
  } else return;

  if (!aabb(box, b.hurtBox)) return;

  if (isSpecial) a.special.hasHit = true;
  else           a.attack.hasHit = true;

  const dir = a.facing;
  const hx = box.x + box.w * 0.5;
  const hy = box.y + box.h * 0.5;

  // CORREÇÃO: Defesa baseada na posição real, não no 'facing' congelado do atacante
  const dirToAttacker = a.x >= b.x ? 1 : -1;
  const facingAttacker = b.facing === dirToAttacker;
  const blocked = !isSpecial && b.blocking && facingAttacker && b.onGround;

  if (blocked){
    // CORREÇÃO: Defesa Perfeita (Zero Dano)
    b.vx = dir * 2.6;
    b.hitstun = 7;
    b.blockstun = true; // Aplica o estado de blockstun
    b.flash = 5;
    shake = Math.max(shake, 4); hitstop = 3;
    spawnParticles(hx, hy, '#8fd0ff', 8, 0.8);
    beep(700, 0.06, 'square', 0.04);
  } else {
    b.hp = Math.max(0, b.hp - def.damage);
    b.vx = dir * def.knockback; b.vy = def.launch;
    b.hitstun = def.hitstun; b.blockstun = false;
    b.flash = isSpecial ? 16 : 9;
    b.charging = false; b.chargeTime = 0;
    shake = Math.max(shake, isSpecial ? 18 : 9);
    hitstop = isSpecial ? 9 : 5;
    spawnParticles(hx, hy, '#ffd166', isSpecial ? 30 : 16, isSpecial ? 1.9 : 1.3);
    spawnParticles(hx, hy, isSpecial ? '#7de3ff' : '#ff7a4d', isSpecial ? 20 : 8, isSpecial ? 1.6 : 1.0);
    spawnDamageNumber(b.x + rnd(-10,10), b.y - b.h - 12, Math.round(def.damage), isSpecial ? '#9ff0ff' : '#ffe08a', isSpecial);
    beep(isSpecial ? 90 : 180, isSpecial ? 0.32 : 0.13, 'sawtooth', isSpecial ? 0.09 : 0.06);
    if (!isSpecial) a.registerHit();
  }
}

/* ============================================================
   IA & ZONA
============================================================ */
function aiThink(ai, foe, dt){
  if (ai.ko || ai.special) return;
  const dist = Math.abs(foe.x - ai.x), dir = foe.x > ai.x ? 1 : -1;
  const inp = { left:false, right:false, jump:false, block:false, crouch:false, punch:false, kick:false, special:false };
  const foeAttacking = !!foe.attack;

  if (foeAttacking && !ai._foeWasAttacking) ai._shouldBlock = Math.random() < 0.5 && dist < 150;
  ai._foeWasAttacking = foeAttacking;

  if (ai._chargingSpecial){
    if (ai.specialCharge <= 0 || ai.hitstun > 0 || ai.attack || ai.specialRecover > 0) ai._chargingSpecial = false;
    else inp.special = true;
  } else if (ai.specialCharge > 0 && ai.specialRecover <= 0 && !ai.attack && ai.hitstun <= 0 && ai.onGround && dist > 120 && dist < 400){
    if (Math.random() < 0.005 * dt) ai._chargingSpecial = true;
  }

  const canAct = ai.hitstun <= 0 && !ai.attack && !ai._chargingSpecial;

  // CORREÇÃO: Mantém a guarda no blockstun
  if (ai._chargingSpecial) {
    // parado
  } else if (ai.blockstun || (canAct && ai._shouldBlock && foeAttacking && dist < 150 && ai.onGround)){
    inp.block = true;
  } else if (canAct){
    if (dist > 100) inp[dir === 1 ? 'right' : 'left'] = true;
    else if (dist < 52) inp[dir === 1 ? 'left' : 'right'] = true;
    else if (Math.random() < 0.012 * dt) inp[Math.random() < 0.5 ? 'left' : 'right'] = true;

    if (ai.attackCooldown <= 0 && dist < 108 && Math.random() < 0.075 * dt) {
      if (dist > 74) inp.kick = true; else inp.punch = true;
    }
    if (ai.onGround && Math.random() < 0.004 * dt) inp.jump = true;
  }
  applyInput(ai, inp, dt, foe);
}

function updateStorm(dt){
  if (!storm.active){
    if (roundFrames > 60 * 12){
      storm.active = true;
      announcement = { text:'ZONA FECHANDO!', sub:'Saia da névoa roxa', timer: 100 };
      beep(150, 0.4, 'sawtooth', 0.05);
    }
    return;
  }
  storm.left += 0.32 * dt; storm.right -= 0.32 * dt;
  const cx = W / 2;
  if (storm.left > cx - 140) storm.left = cx - 140;
  if (storm.right < cx + 140) storm.right = cx + 140;
}
function applyStorm(f, dt){
  if (!storm.active || f.ko) return;
  if (f.x < storm.left || f.x > storm.right){
    f.hp = Math.max(0, f.hp - 0.04 * dt); f.flash = Math.max(f.flash, 2);
    if (Math.random() < 0.15 * dt) spawnParticles(f.x + rnd(-16,16), f.y - rnd(10,80), '#a06bff', 1, 0.6);
  }
}

/* ============================================================
   FLUXO DE PARTIDA
============================================================ */
function enterSelect(two){
  twoPlayer = isMobile() ? false : two; 
  sel = { step:0, p1:sel.p1, p2:sel.p2 };
  phase = 'select'; beep(660, 0.1, 'sine', 0.05);
}
function finishSelect(){
  player1.ch = CHARS[sel.p1];
  let i = sel.p2;
  if (!twoPlayer){ do { i = Math.floor(Math.random() * CHARS.length); } while (i === sel.p1); }
  player2.ch = CHARS[i];
  startMatch(twoPlayer);
}
function startMatch(vsCPUIsPlayer2){
  twoPlayer = isMobile() ? false : vsCPUIsPlayer2;
  player2.isAI = !twoPlayer;
  player2.name = twoPlayer ? 'P2' : 'CPU';
  player1.roundsWon = 0; player2.roundsWon = 0; roundNum = 1;
  startRound(); beep(660, 0.1, 'sine', 0.05);
}
function startRound(){
  player1.reset(260, 1); player2.reset(700, -1);
  storm = { left: ARENA_LEFT, right: ARENA_RIGHT, active: false };
  roundFrames = 0; particles.length = 0; damageNumbers.length = 0; shake = 0; hitstop = 0;
  phase = 'intro'; phaseTimer = 95;
  announcement = { text: 'ROUND ' + roundNum, sub:'', timer: 95 };
}
function endRound(winner){
  if (winner) winner.roundsWon++;
  phase = 'roundover'; phaseTimer = 150;
  announcement = { text: winner ? winner.ch.name + ' VENCEU!' : 'EMPATE', sub:'', timer: 150 };
  if (winner) beep(700, 0.18, 'sine', 0.06); else beep(220, 0.25, 'sine', 0.05);
}

/* ============================================================
   UPDATE LOOP
============================================================ */
function update(dt){
  if (announcement.timer > 0) announcement.timer -= dt;
  if (hitstop > 0){ hitstop -= dt; return; }

  shake *= Math.pow(0.86, dt);
  if (shake < 0.15) shake = 0;
  updateParticles(dt);

  if (phase === 'menu'){
    if (justPressed['Digit1'] || justPressed['Enter'] || justPressed['Space']) enterSelect(false);
    if (!isMobile() && justPressed['Digit2']) enterSelect(true);
    clearJustPressed(); return;
  }

  if (phase === 'select'){
    const two2 = !isMobile() && twoPlayer && sel.step === 1;
    const L = two2 ? 'ArrowLeft' : 'KeyA', R = two2 ? 'ArrowRight' : 'KeyD', OK = two2 ? 'KeyN' : 'KeyQ';
    const k = two2 ? 'p2' : 'p1';
    if (justPressed[L]){ sel[k] = (sel[k] + CHARS.length - 1) % CHARS.length; beep(520, 0.05, 'square', 0.03); }
    if (justPressed[R]){ sel[k] = (sel[k] + 1) % CHARS.length; beep(520, 0.05, 'square', 0.03); }
    if (justPressed[OK] || justPressed['Enter']){
      beep(800, 0.1, 'sine', 0.05);
      if (!isMobile() && twoPlayer && sel.step === 0){ sel.step = 1; sel.p2 = (sel.p1 + 1) % CHARS.length; }
      else finishSelect();
    }
    if (justPressed['Escape']) phase = 'menu';
    clearJustPressed(); return;
  }

  if (phase === 'intro'){
    phaseTimer -= dt;
    player1.update(dt, player2); player2.update(dt, player1);
    if (phaseTimer <= 0){
      phase = 'fight'; announcement = { text:'LUTEM!', sub:'', timer: 50 };
      beep(880, 0.15, 'square', 0.05);
    }
    clearJustPressed(); return;
  }

  if (phase === 'fight'){
    roundFrames += dt;

    if (!player1.ko) applyInput(player1, readInput(P1_KEYS), dt, player2);
    if (twoPlayer){
      if (!player2.ko) applyInput(player2, readInput(P2_KEYS), dt, player1);
    } else {
      aiThink(player2, player1, dt);
    }

    player1.update(dt, player2); player2.update(dt, player1);
    resolveHits(player1, player2); resolveHits(player2, player1);
    updateStorm(dt); applyStorm(player1, dt); applyStorm(player2, dt);

    const p1dead = player1.hp <= 0, p2dead = player2.hp <= 0;
    if (p1dead || p2dead){
      const loser = p1dead ? player1 : player2;
      loser.ko = true; loser.vy = -9; loser.vx = (loser === player1 ? -1 : 1) * 7;
      shake = 14; spawnParticles(loser.x, loser.y - 50, '#ff5566', 26, 1.6); beep(110, 0.5, 'sawtooth', 0.07);

      let winner = null;
      if (!(p1dead && p2dead)) winner = p1dead ? player2 : player1;
      endRound(winner);
    } else if (roundFrames >= ROUND_TIME){
      let winner = null;
      if (player1.hp > player2.hp) winner = player1;
      else if (player2.hp > player1.hp) winner = player2;
      endRound(winner);
    }

    clearJustPressed(); return;
  }

  if (phase === 'roundover'){
    phaseTimer -= dt;
    player1.update(dt, player2); player2.update(dt, player1);
    if (phaseTimer <= 0){
      if (player1.roundsWon >= 2 || player2.roundsWon >= 2){
        phase = 'matchover'; phaseTimer = 240;
        const champ = player1.roundsWon >= 2 ? player1 : player2;
        announcement = { text: champ.ch.name + ' É O CAMPEÃO!', sub:'', timer: 240 };
        beep(880, 0.3, 'sine', 0.07);
      } else {
        roundNum++; startRound();
      }
    }
    clearJustPressed(); return;
  }

  if (phase === 'matchover'){
    phaseTimer -= dt;
    player1.update(dt, player2); player2.update(dt, player1);
    if (phaseTimer <= 0 || justPressed['Enter'] || justPressed['Space']){
      phase = 'menu'; player1.roundsWon = 0; player2.roundsWon = 0;
    }
    clearJustPressed(); return;
  }
}
function clearJustPressed(){ for (const k in justPressed) delete justPressed[k]; }

/* ============================================================
   DESENHO (RENDERIZAÇÃO)
============================================================ */
function roundRect(x, y, w, h, r){
  if (w < 0){ x += w; w = -w; } if (h < 0){ y += h; h = -h; }
  r = Math.min(r, w/2, h/2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

const OUT = '#14101c';
function lm(a, b, w, col){
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = w + 4; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
}
function blob(x, y, rx, ry, col){
  ctx.fillStyle = col; ctx.strokeStyle = OUT; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
}
function tri(x1, y1, x2, y2, x3, y3, col){
  ctx.fillStyle = col; ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.closePath(); ctx.fill(); ctx.stroke();
}

function drawLeg(h, k, f, col, C, c){ lm(h, k, 20, c(col)); lm(k, f, 16, c(col)); blob(f[0] + 7, f[1] - 4, 12, 7, c(C.boots)); }
function drawArm(s, e, h, C, c){
  lm(s, e, 14, c(C.sleeve || C.skin)); lm(e, h, 12, c(C.skin));
  if (C.glove){ const dx = h[0] - e[0], dy = h[1] - e[1], d = Math.hypot(dx, dy) || 1; lm([h[0] - dx/d*10, h[1] - dy/d*10], h, 15, c(C.glove)); }
  blob(h[0], h[1], 8.5, 8.5, c(C.fist || C.skin));
}
function drawTorso(sh, hp, C, c){
  ctx.lineJoin = 'round'; ctx.beginPath();
  ctx.moveTo(sh[0] - 18, sh[1]); ctx.lineTo(sh[0] + 19, sh[1]); ctx.lineTo(hp[0] + 14, hp[1] + 8); ctx.lineTo(hp[0] - 14, hp[1] + 8); ctx.closePath();
  ctx.fillStyle = c(C.shirtless ? C.skin : C.top); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = OUT; ctx.stroke();
  if (C.shirtless){
    ctx.strokeStyle = 'rgba(60,20,10,.45)'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(sh[0] + 3, sh[1] + 6); ctx.lineTo(sh[0] + 3, hp[1]);
    for (let i = 1; i <= 3; i++){ const y = sh[1] + 8 + i * ((hp[1] - sh[1] - 8) / 4); ctx.moveTo(sh[0] - 6, y); ctx.lineTo(sh[0] + 12, y); }
    ctx.stroke();
  } else if (!C.sleeve){
    ctx.fillStyle = c(C.skin); ctx.beginPath(); ctx.moveTo(sh[0] - 2, sh[1]); ctx.lineTo(sh[0] + 12, sh[1]); ctx.lineTo(sh[0] + 4, sh[1] + 22); ctx.closePath(); ctx.fill();
  } else {
    ctx.strokeStyle = c('#e8c04a'); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sh[0] - 17, sh[1] + 1); ctx.lineTo(sh[0] + 18, sh[1] + 1); ctx.stroke();
  }
  ctx.fillStyle = c(C.belt); ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.fillRect(hp[0] - 15, hp[1] - 2, 30, 9); ctx.strokeRect(hp[0] - 15, hp[1] - 2, 30, 9);
  if (!C.shirtless && !C.sleeve) lm([hp[0] - 12, hp[1] + 5], [hp[0] - 22, hp[1] + 20], 5, c(C.belt));
}
function drawHead(h, C, c, t, hurt){
  const x = h[0], y = h[1], sw = Math.sin(t * 0.009);
  if (C.style === 'long') lm([x - 8, y - 6], [x - 32, y + 8 + sw*3], 12, c(C.hair));
  if (C.style === 'tail') lm([x - 10, y - 6], [x - 30, y + 6 + sw*3], 6, c(C.hair));
  if (C.band){
    lm([x - 12, y - 8], [x - 36, y - 2 + sw*5], 5, c(C.band));
    lm([x - 12, y - 8], [x - 32, y + 8 + Math.sin(t*0.009 + 1)*4], 5, c(C.band));
  }
  blob(x, y, 16, 17, c(C.skin));
  ctx.fillStyle = c(C.hair); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.arc(x, y, 17, Math.PI*0.72, Math.PI*2.02); ctx.lineTo(x + 2, y - 4); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (C.style === 'spiky'){ for (const [bx, tx, ty] of [[-12,-24,-32],[-2,-10,-40],[8,4,-38],[14,18,-30]]) tri(x + bx - 7, y - 12, x + bx + 7, y - 12, x + tx, y + ty, c(C.hair)); }
  else if (C.style === 'long'){ for (const [bx, tx, ty] of [[-6,-8,-34],[6,10,-38],[14,24,-26]]) tri(x + bx - 7, y - 12, x + bx + 7, y - 12, x + tx, y + ty, c(C.hair)); }
  else if (C.style === 'buns'){ blob(x - 11, y - 20, 8, 8, c(C.hair)); blob(x + 1, y - 24, 7.5, 7.5, c(C.hair)); blob(x - 10, y - 13, 3, 3, c('#ffffff')); }
  ctx.strokeStyle = OUT; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x + 2, y - 5); ctx.lineTo(x + 12, y - 2); ctx.stroke();
  ctx.fillStyle = OUT; ctx.beginPath(); ctx.ellipse(x + 8, y + 2, 2.2, 3, 0, 0, Math.PI*2); ctx.fill();
  if (hurt){ ctx.beginPath(); ctx.ellipse(x + 9, y + 10, 3, 4, 0, 0, Math.PI*2); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(x + 6, y + 10); ctx.lineTo(x + 12, y + 9); ctx.stroke(); }
}

function drawChar(f, t){
  const C = f.ch, c = v => f.flash > 0 ? '#ffffff' : v;
  const gy = f.gy !== undefined ? f.gy : GROUND_Y;
  const sp = f.special, fly = !!(sp && sp.phase === 'fly');
  const wind = !!(sp && (sp.phase === 'windup' || sp.phase === 'recover'));
  const hurt = f.hitstun > 0 && !f.ko;
  const air = !f.onGround && !f.ko;

  const lift = clamp((gy - f.y) / 300, 0, 1);
  ctx.save(); ctx.globalAlpha = 0.34 * (1 - lift * 0.6); ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(f.x, gy + 6, 34 * (1 - lift*0.35), 9 * (1 - lift*0.35), 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

  let pe = 0, ke = 0;
  if (f.attack){
    const d = f.attack.def, fr = f.attack.frame; let e;
    if (fr < d.start) e = -0.4 * (fr / d.start);
    else if (fr <= d.end) e = 1;
    else e = Math.max(0, 1 - (fr - d.end) / Math.max(1, d.duration - d.end));
    if (f.attack.type === 'punch') pe = e; else ke = e;
  }

  ctx.save(); ctx.translate(f.x, f.y); ctx.scale(f.facing || 1, 1);
  if (f.ko) ctx.rotate(-1.35);

  const idle = !air && !f.ko && !hurt;
  const dip = f.crouching ? 20 : wind ? 16 : f.charging ? 8 : 0;
  const br = idle ? Math.sin(t * 0.006) * 1.6 : 0;
  const hipY = -44 + dip;
  const lean = (hurt || f.ko) ? -12 : f.blocking ? -2 : Math.max(pe, 0) * 6 - Math.max(ke, 0) * 6;
  let hp = [lean * 0.35, hipY], sh = [lean, hipY - 34 + br];
  if (fly){ hp = [-8, -46]; sh = [-28, -82]; }

  const moving = f.onGround && Math.abs(f.vx) > 0.6;
  const walk = moving ? Math.sin(f.walkPhase) * 14 : 0;
  const sw = f.crouching ? 32 : 24;
  let ff = [sw + walk, 0], bf = [-sw - walk, 0];
  if (air || fly){ bf = [-14, -18]; ff = [22, -30]; }
  if (fly){ bf = [-34, -6]; ff = [62, -28]; }
  if (ke > 0 && !fly) ff = [sw + ke * 48, -ke * 50];
  const kn = (a, b, o) => [(a[0] + b[0]) / 2 + o, (a[1] + b[1]) / 2 - 2];

  let fh = [sh[0] + 30, sh[1] + 2], fe = [sh[0] + 16, sh[1] + 22];
  let bh = [sh[0] + 20, sh[1] + 12], be = [sh[0] + 2, sh[1] + 28];
  if (pe !== 0){ fh = [sh[0] + 30 + pe * 42, sh[1] + 4]; fe = [sh[0] + 14 + pe * 20, sh[1] + 12 + (1 - Math.max(pe, 0)) * 10]; }
  if (f.blocking){ fh = [sh[0] + 24, sh[1] - 10]; fe = [sh[0] + 22, sh[1] + 14]; bh = [sh[0] + 16, sh[1] - 2]; be = [sh[0] + 8, sh[1] + 16]; }
  if (f.charging){ fh = [sh[0] + 16, sh[1] + 40]; fe = [sh[0] + 14, sh[1] + 20]; bh = [sh[0] + 8, sh[1] + 38]; be = [sh[0] + 2, sh[1] + 20]; }
  if (fly){ fh = [sh[0] + 22, sh[1] - 26]; fe = [sh[0] + 16, sh[1] - 10]; bh = [sh[0] - 18, sh[1] + 22]; be = [sh[0] - 10, sh[1] + 14]; }
  if (hurt || f.ko){ fh = [sh[0] - 8, sh[1] + 30]; fe = [sh[0] + 6, sh[1] + 22]; bh = [sh[0] - 20, sh[1] + 24]; be = [sh[0] - 14, sh[1] + 16]; }

  const hd = [sh[0] + (fly ? -6 : hurt || f.ko ? 1 : 5), sh[1] - 21];

  drawLeg(hp, kn(hp, bf, -8), bf, C.pantsD, C, c); drawArm([sh[0] - 6, sh[1] + 8], be, bh, C, c);
  drawTorso(sh, hp, C, c); drawLeg(hp, kn(hp, ff, 10), ff, C.pants, C, c);
  drawHead(hd, C, c, t, hurt || f.ko); drawArm([sh[0] + 8, sh[1] + 8], fe, fh, C, c);
  ctx.restore();
}

function drawFighter(f, t){
  drawChar(f, t);
  const cx = f.x, feet = f.y, dir = f.facing;
  if (f.special && f.special.phase === 'fly'){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#7de3ff';
    ctx.beginPath(); ctx.ellipse(cx + dir*24, feet - 40, 66, 42, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.6; ctx.strokeStyle = '#bff4ff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx + dir*70, feet - 28); ctx.lineTo(cx + dir*118, feet - 34); ctx.stroke();
    ctx.restore();
  }
  if (f.blocking){
    ctx.save(); ctx.globalAlpha = 0.4 + Math.sin(t * 0.02) * 0.1;
    ctx.strokeStyle = '#8fd0ff'; ctx.lineWidth = 4; ctx.shadowColor = '#8fd0ff'; ctx.shadowBlur = 14;
    ctx.beginPath();
    // Arco do escudo sempre do lado que ele está olhando
    ctx.arc(cx + dir * 22, feet - (f.crouching ? 34 : 54), 40, dir === 1 ? -Math.PI/2 : Math.PI/2, dir === 1 ? Math.PI/2 : -Math.PI/2, false);
    ctx.stroke(); ctx.restore();
  }
  if (f.charging){
    const p = clamp(f.chargeTime / SPECIAL.chargeTime, 0, 1);
    ctx.save();
    for (let i = 0; i < 3; i++){
      const rr = 34 + ((t * 0.06 + i * 24) % 46) + p * 18;
      ctx.globalAlpha = (0.55 - i * 0.14) * (0.5 + p * 0.5); ctx.strokeStyle = '#7de3ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(cx, feet - 46, rr, rr * 0.45, 0, 0, Math.PI*2); ctx.stroke();
    }
    ctx.restore();
    const bw = 64, bx = cx - bw/2, by = feet - 140;
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; roundRect(bx - 2, by - 2, bw + 4, 10, 4); ctx.fill();
    const g2 = ctx.createLinearGradient(bx, 0, bx + bw, 0); g2.addColorStop(0, '#4be1ff'); g2.addColorStop(1, '#ffffff');
    ctx.fillStyle = g2; roundRect(bx, by, Math.max(1, bw * p), 6, 3); ctx.fill();
  }
  if (f.flash > 4){
    ctx.save(); ctx.globalAlpha = 0.35; ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx, feet - 48, 46, 0, Math.PI*2); ctx.fill(); ctx.restore();
  }
}

function pagoda(x, base, s){
  for (let i = 0; i < 3; i++){
    const w = (110 - i*24) * s, y = base - i*44*s;
    ctx.fillStyle = '#2a1445'; ctx.fillRect(x - w*0.35, y - 30*s, w*0.7, 30*s);
    ctx.fillStyle = '#170a2a'; ctx.beginPath(); ctx.moveTo(x - w*0.7, y - 28*s); ctx.lineTo(x + w*0.7, y - 28*s);
    ctx.lineTo(x + w*0.4, y - 46*s); ctx.lineTo(x - w*0.4, y - 46*s); ctx.closePath(); ctx.fill();
  }
}
function drawBackground(t){
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);

  pagoda(150, 410, 1); pagoda(810, 410, 1.15);

  for (let row = 0; row < 2; row++){
    for (let i = 0; i < 40; i++){

function drawStorm(t){
  if (!storm.active) return;
  const pulse = 0.4 + Math.sin(t * 0.006) * 0.08;
  ctx.save(); ctx.fillStyle = `rgba(120, 45, 210, ${pulse})`; ctx.fillRect(0, 0, storm.left, H); ctx.fillRect(storm.right, 0, W - storm.right, H);
  ctx.globalAlpha = 0.18; ctx.fillStyle = '#c39bff';
  for (let i = 0; i < 22; i++){ const y = ((i * 34 + t * 0.08) % (H + 60)) - 30; ctx.fillRect(0, y, storm.left, 8); ctx.fillRect(storm.right, y, W - storm.right, 8); }
  ctx.globalAlpha = 1; ctx.strokeStyle = 'rgba(180,120,255,0.95)'; ctx.lineWidth = 4; ctx.shadowBlur = 24; ctx.shadowColor = '#a06bff';
  ctx.beginPath(); ctx.moveTo(storm.left, 0); ctx.lineTo(storm.left, H); ctx.stroke();

function drawHealthBar(f, x, y, w, h, flip){
  ctx.fillStyle = 'rgba(8,12,26,0.85)'; roundRect(x - 3, y - 3, w + 6, h + 6, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; roundRect(x, y, w, h, 6); ctx.fill();
  const hpPct = clamp(f.hp / f.maxHp, 0, 1), dispPct = clamp(f.dispHp / f.maxHp, 0, 1);
  const trailW = w * dispPct; ctx.fillStyle = 'rgba(255,220,120,0.85)';
  if (flip) roundRect(x + w - trailW, y, trailW, h, 6); else roundRect(x, y, trailW, h, 6); ctx.fill();
  const curW = w * hpPct; const grad = ctx.createLinearGradient(x, y, x + w, y);
  if (hpPct > 0.55){ grad.addColorStop(0,'#35e08a'); grad.addColorStop(1,'#9dffcb'); }
  else if (hpPct > 0.25){ grad.addColorStop(0,'#ffc94d'); grad.addColorStop(1,'#ffe9a3'); }
  else { grad.addColorStop(0,'#ff3b52'); grad.addColorStop(1,'#ff8a99'); }
  ctx.fillStyle = grad;
  if (flip) roundRect(x + w - curW, y, curW, h, 6); else roundRect(x, y, curW, h, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  if (flip) roundRect(x + w - curW, y + 2, curW, h * 0.35, 4); else roundRect(x, y + 2, curW, h * 0.35, 4); ctx.fill();
  ctx.strokeStyle = 'rgba(150,190,255,0.5)'; ctx.lineWidth = 2; roundRect(x, y, w, h, 6); ctx.stroke();

  ctx.font = 'bold 15px ' + FONT_UI; ctx.fillStyle = '#dce8ff'; ctx.textBaseline = 'middle'; ctx.textAlign = flip ? 'right' : 'left';
  ctx.fillText(f.ch.name + '  ·  ' + f.name, flip ? x + w : x, y + h + 16);
  for (let i = 0; i < 2; i++){
    const px = flip ? x + w - 10 - i * 22 : x + 10 + i * 22, py = y + h + 16;
    ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2); ctx.fillStyle = i < f.roundsWon ? '#ffd166' : 'rgba(255,255,255,0.14)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

function drawSpecialMeter(f, x, y, flip){
  const w = 168, h = 11, ready = f.specialCharge > 0;
  const chargingP = f.charging ? clamp(f.chargeTime / SPECIAL.chargeTime, 0, 1) : 0;
  const p = ready ? (f.charging ? chargingP : 1) : (f.hitCounter / SPECIAL.hitsRequired);

  ctx.save(); ctx.fillStyle = 'rgba(8,12,26,0.85)'; roundRect(x - 2, y - 2, w + 4, h + 4, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; roundRect(x, y, w, h, 4); ctx.fill();
  const fillW = w * clamp(p, 0, 1);
  if (fillW > 1){
    const g = ctx.createLinearGradient(x, y, x + w, y);
    if (ready && f.charging){ g.addColorStop(0, '#ffd84d'); g.addColorStop(1, '#fff8c4'); }
    else if (ready){ g.addColorStop(0, '#7de3ff'); g.addColorStop(1, '#d4f7ff'); }
    else { g.addColorStop(0, '#4f6fa8'); g.addColorStop(1, '#7f9fd6'); }
    ctx.fillStyle = g;
    if (flip) roundRect(x + w - fillW, y, fillW, h, 4); else roundRect(x, y, fillW, h, 4); ctx.fill();
  }
  ctx.strokeStyle = ready ? 'rgba(140,230,255,0.85)' : 'rgba(120,150,200,0.35)'; ctx.lineWidth = 1.5; roundRect(x, y, w, h, 4); ctx.stroke();
  ctx.font = 'bold 11px ' + FONT_UI; ctx.textBaseline = 'middle'; ctx.textAlign = flip ? 'right' : 'left';
  let label, col;
  if (f.charging){ label = 'CARREGANDO ESPECIAL ' + Math.round(chargingP * 100) + '%'; col = '#ffe27a'; }
  else if (ready){ label = '✦ ESPECIAL PRONTO' + (isMobile() && !flip ? ' — SEGURE ✦' : ' — SEGURE ' + (flip ? '2' : '1')); col = '#bff0ff'; }
  else { label = 'ESPECIAL ' + f.hitCounter + '/' + SPECIAL.hitsRequired + ' GOLPES'; col = 'rgba(190,210,255,0.75)'; }
  ctx.fillStyle = col; ctx.fillText(label, flip ? x + w : x, y + h + 10); ctx.restore();
}

function drawHUD(t){

function drawParticles(){

  ctx.globalAlpha = 1;
  for (const d of damageNumbers){
    const a = clamp(d.life / d.maxLife, 0, 1), size = d.big ? 40 : 26;

}

function overlay(a){

function drawSelect(t){

let clock = 0;
function render(){
  ctx.clearRect(0, 0, W, H);
  ctx.save(); if (shake > 0) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBackground(clock); drawStorm(clock);
  if (phase !== 'menu' && phase !== 'select'){ drawFighter(player1, clock); drawFighter(player2, clock); }
  drawParticles(); ctx.restore();
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.45, W/2, H/2, H*0.95); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (phase === 'menu') drawMenu(clock);
  else if (phase === 'select') drawSelect(clock);
  else { drawHUD(clock); drawAnnouncement(); }
}

const FONT_UI = "'Rajdhani', 'Segoe UI', system-ui, sans-serif";
const FONT_TITLE = "'Bebas Neue', Impact, 'Arial Narrow', sans-serif";
let lastTime = performance.now();

function loop(now){
  clock = now; let dt = (now - lastTime) / 16.6667; lastTime = now; dt = Math.min(dt, 2.5);
  if (justPressed['KeyP']){ muted = !muted; btnMute.textContent = muted ? '🔇' : '🔊'; }
  update(dt); render();
  syncMobilePanels();
  requestAnimationFrame(loop);
}

const btnMute = document.getElementById('btnMute');
btnMute.onclick = () => { muted = !muted; btnMute.textContent = muted ? '🔇' : '🔊'; btnMute.blur(); };
document.getElementById('btnFs').onclick = async function(){
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
      if (isMobile() && screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch (_) {}
      }
    }
  } catch (_) {} this.blur();
};

// === CONTROLES MOBILE ===
function syncMobilePanels(){
  const mobile = isMobile();
  document.getElementById('mobileMenu').style.display = mobile && phase === 'menu' ? 'flex' : 'none';
  document.getElementById('mobileSelect').style.display = mobile && phase === 'select' ? 'flex' : 'none';
  document.getElementById('touchControls').style.display = mobile && (phase === 'fight' || phase === 'intro' || phase === 'roundover') ? 'block' : 'none';
}

function pressKey(code, pressed) {
  if (pressed && !keys[code]) justPressed[code] = true;
  keys[code] = pressed;
}
document.querySelectorAll('[data-key]').forEach(btn => {
  if (btn.tagName === 'KBD') return; // ignora teclas do layout html
  const code = btn.getAttribute('data-key');
  
  const down = (e) => {
    e.preventDefault(); // evita scroll e zoom
    pressKey(code, true);
    btn.classList.add('active');
  };
  const up = (e) => {
    e.preventDefault();
    pressKey(code, false);
    btn.classList.remove('active');
  };
  
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

document.getElementById('mobileStart').addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
      await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch (_) {}
      }
    }
  } catch (_) {}
  if (phase === 'menu') enterSelect(false);
});
document.getElementById('mobilePrev').addEventListener('click', () => {
  if (phase === 'select') { sel.p1 = (sel.p1 + CHARS.length - 1) % CHARS.length; beep(520,.05,'square',.03); }
});
document.getElementById('mobileNext').addEventListener('click', () => {
  if (phase === 'select') { sel.p1 = (sel.p1 + 1) % CHARS.length; beep(520,.05,'square',.03); }
});
document.getElementById('mobileConfirm').addEventListener('click', () => {
  if (phase === 'select') finishSelect();
});

// Previne menu de contexto (segurar dedo na tela) no mobile
document.addEventListener('contextmenu', e => { if (isMobile()) e.preventDefault(); });

// Limpa teclas se sair da tela
function releaseAllKeys() {
  for (const k in keys) keys[k] = false;
  document.querySelectorAll('.dpad-btn, .action-btn').forEach(b => b.classList.remove('active'));
}
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAllKeys(); });
window.addEventListener('blur', releaseAllKeys);

requestAnimationFrame(loop);

})();
</script>
